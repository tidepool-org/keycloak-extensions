parent=keycloak.v2

# Layer Tidepool overrides on top of keycloak.v2's stylesheet. Both paths are
# resolved independently against the theme chain, so css/styles.css comes from
# the parent and css/tidepool.css from this theme.
styles=css/styles.css css/tidepool.css

# terms.js drives the age/terms checkbox enable/disable on the custom terms
# screens (clinician_terms.ftl, patient_terms.ftl).
scripts=js/terms.js

# Parent keycloak.v2 sets darkMode=true, but we have no dark-mode CSS yet.
# Disable so native form controls don't render dark on our white card.
darkMode=false
