volumes:
  providers:
    driver: local
  postgres_data:
    driver: local
  maven_cache:
    driver: local

services:
  postgres:
    image: postgres:14.17
    container_name: tp-keycloak-pg
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 6543:5432

  providers:
    image: maven:3.8.5-openjdk-17
    working_dir: /build
    command: [
      "/bin/sh",
      "-c",
      "git submodule status | awk '/^-/ {print $$2}' | xargs -r -I{} git submodule update --init -- {} && ./mvnw -B clean package -pl admin,keycloak-home-idp-discovery,keycloak-spi-trusted-device/spi -am -DskipTests && rm -f /providers/* && cp admin/target/admin-LATEST.jar /providers/ && cp keycloak-home-idp-discovery/target/keycloak-home-idp-discovery.jar /providers/ && cp keycloak-spi-trusted-device/spi/target/keycloak-spi-trusted-device-*.jar /providers/ && curl -fsSL -o /providers/keycloak-rest-provider.jar https://github.com/daniel-frak/keycloak-user-migration/releases/download/6.2.2/keycloak-rest-provider-6.2.2.jar"]
    volumes:
      - .:/build
      - maven_cache:/root/.m2
      - providers:/providers

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: tp-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_DB_SCHEMA: public
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
      TIDEPOOL_APP_URL: "https://app.tidepool.org"
      TIDEPOOL_ASSETS_URL: "https://s3-us-west-2.amazonaws.com/tidepool-qa1-asset"
      TIDEPOOL_ZENDESK_KEY: "d1aad8b3-67d8-4f44-9d87-9e8a0ed8149d"
    ports:
      - 127.0.0.1:8089:8080
    volumes:
      - ./tidepool-theme:/opt/keycloak/themes/tidepool
      - providers:/opt/keycloak/providers
    depends_on:
      providers:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    command: start-dev
