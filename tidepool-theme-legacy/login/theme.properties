# Inherit from the classic v1 "keycloak" theme (not v2 "keycloak.v2"); only the
# overrides below differ from upstream keycloak/login/theme.properties.
parent=keycloak
import=common/keycloak

# Replace upstream PF4/PF3 bundles with locally-built PatternFly + Zocial + custom
# Tidepool stylesheets (css/styles.css carries the tp-* classes referenced below).
styles=node_modules/patternfly/dist/css/patternfly.css node_modules/patternfly/dist/css/patternfly-additions.css lib/zocial/zocial.css css/login.css css/styles.css
# Drives the age/terms checkbox enable/disable logic on the custom terms screens.
scripts=js/terms.js

# temporarily set to no-op link, because we can't provide per realm links
tidepoolUrl=javascript:;
# Injected into template.ftl to load the Zendesk support widget; empty value
# (unset env var) short-circuits the widget in the template.
zendeskKey=${env.TIDEPOOL_ZENDESK_KEY}

# The block below remaps Keycloak's well-known class keys onto Tidepool's
# design-system classes (tp-*) so upstream FTL markup picks up our styling
# without needing to edit every template.
kcAlertClass=pf-c-alert tp-alert pf-m-inline
kcInputClass=tp-form-control
kcFormOptionsWrapperClass=tp-form-options-wrapper
kcInputErrorMessageClass=tp-form-error
kcButtonClass=tp-btn
kcButtonDefaultClass=tp-btn-default
kcButtonPrimaryClass=tp-btn-primary
kcFooterClass=tp-footer
kcFooterWrapperClass=tp-footer-wrapper
# Hide Keycloak's default page header; template.ftl renders the Tidepool logo
# in its place (clinician vs. patient logo, chosen via the `role` helper).
kcHeaderClass=hidden
kcRegisterTitleClass=tp-register-title
kcLabelWrapperClass=tp-label-wrapper
kcInputWrapperClass=tp-input-wrapper
kcFormButtonsClass=tp-form-buttons
kcFormClass=tp-form
kcFormPasswordVisibilityButtonClass=pf-c-button pf-m-control tp-password-visibility
